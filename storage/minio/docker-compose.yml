name: playground

services:
  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      HOST: 0.0.0.0
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - playground-net
    restart: always

networks:
  playground-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
